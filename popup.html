<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laraigo Copiloto</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-area">
      <div class="logo-badge">Laraigo</div>
      <h3>Copiloto Claro</h3>
    </div>
    <span class="version">v2.0</span>
  </div>

  <div class="container">
    <div class="card">
      <div class="section-label">Estado en esta pestaña:</div>

      <div id="status-banner" class="status-banner active">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">ACTIVO</span>
      </div>

      <div class="toggle-buttons">
        <button id="btn-set-active" class="btn-state btn-active-state selected">
          🟢 Activo
        </button>
        <button id="btn-set-inactive" class="btn-state btn-inactive-state">
          🔴 No activo
        </button>
      </div>

      <p class="hint-text" id="hint-text">
        Este cambio solo aplica a esta pestaña/ventana.
      </p>
    </div>

    <div class="card mode-card">
      <div class="section-label">Modo de Operación:</div>

      <div class="mode-options">
        <button id="btn-mode-greeting" class="mode-option-btn selected">
          <div class="mode-option-title">🔔⚡ Solo Notif. + Saludo</div>
          <div class="mode-option-desc">Notifica en Windows y envía solo el 1° saludo al instante (0s).</div>
        </button>

        <button id="btn-mode-beta" class="mode-option-btn">
          <div class="mode-option-title">
            🧠 Modo Completo <span class="beta-pill">BETA</span>
          </div>
          <div class="mode-option-desc">Saludo 0s + 2° Respuesta automática (Submotivo, TOA, cintillos).</div>
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
